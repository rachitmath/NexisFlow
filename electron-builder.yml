appId: com.nexisflow.app
productName: NexisFlow
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - target: AppImage
      arch:
        - x64
