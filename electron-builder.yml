appId: com.nexisflow.app
productName: NexisFlow
directories:
  output: release
files:
  - dist/**/*
  - package.json
asar: true
npmRebuild: true

publish:
  provider: github
  owner: rachitmath
  repo: NexisFlow

win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NexisFlow

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
